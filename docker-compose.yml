services:
  # Main Flask application
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-super-secret-production-key-change-this
      - JWT_SECRET_KEY=your-jwt-secret-key-change-this
      - DATABASE_URL=postgresql://hotel_user:secure_password_change_this@db:5432/hotel_booking_prod
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USE_TLS=true
      - MAIL_USERNAME=your-email@gmail.com
      - MAIL_PASSWORD=your-app-password
      - MAIL_DEFAULT_SENDER=Namibia Hotels <noreply@namibiahotels.com>
      - ADMIN_EMAIL=admin@namibiahotels.com
      - STRIPE_SECRET_KEY=your-stripe-secret-key
      - STRIPE_PUBLISHABLE_KEY=your-stripe-publishable-key
      - STRIPE_WEBHOOK_SECRET=your-stripe-webhook-secret
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  # PostgreSQL database (for production)
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=hotel_booking_prod
      - POSTGRES_USER=hotel_user
      - POSTGRES_PASSWORD=secure_password_change_this
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    name: hotel_booking_network